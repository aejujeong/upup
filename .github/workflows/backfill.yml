name: 과거 데이터 받기 (검증용)

on:
  workflow_dispatch:          # Actions 탭에서 수동 실행 버튼만 (자동 실행 없음)
    inputs:
      start:
        description: "시작일"
        default: "2015-01-01"
      end:
        description: "끝일"
        default: "2024-10-31"

permissions:
  contents: write             # 받은 파일을 저장소 bt/ 폴더에 올리기 위해 필요

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350      # GitHub 한 번 실행 최대 6시간 안에서 멈춤
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python backfill.py
        timeout-minutes: 330
        env:
          BT_START: ${{ inputs.start }}
          BT_END: ${{ inputs.end }}
          BT_MAX_MIN: "320"
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
      - name: 받은 파일 저장소에 올리기 (중간에 멈춰도 받은 만큼 올림)
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add bt
          git commit -m "과거 데이터 받기: ${{ inputs.start }} ~ ${{ inputs.end }}" || echo "새로 받은 파일 없음"
          git pull --rebase || true
          git push || echo "올리기 실패"

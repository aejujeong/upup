name: research

# 검증용 계산을 GitHub 서버에서 돌리고 결과를 research-out 브랜치에 올림
on:
  workflow_dispatch:
    inputs:
      script:
        description: "돌릴 파일 (research 폴더 안)"
        default: "dump_test.py"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pykrx pandas
      - run: python research/${{ inputs.script }}
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
      - name: 결과 올리기
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -B research-out
          git add -f research/out_*.txt
          git commit -m "검증 결과 ${{ inputs.script }}" || true
          git push -f origin research-out

name: 외국인 순매수 페이지 갱신

on:
  schedule:
    # 평일 한국시간 18:17 · 20:17 · 22:17 (GitHub 예약 실행이 늦거나 빠지는 경우가 있어 세 번. 정각·30분은 붐벼서 피함)
    - cron: "17 9 * * 1-5"
    - cron: "17 11 * * 1-5"
    - cron: "17 13 * * 1-5"
  workflow_dispatch:          # Actions 탭에서 수동 실행 버튼

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180             # 3시간이 넘으면 멈춤 (받은 데이터는 저장됨)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4  # 지난 실행 때 저장해 둔 데이터 불러오기
        with:
          path: cache
          key: krx-${{ github.run_id }}
          restore-keys: krx-
      - run: python foreign_rank.py
        timeout-minutes: 150         # 이 단계가 2시간 반을 넘으면 멈추고, 아래에서 받은 데이터만 저장
        env:
          OUT_FILE: site/index.html
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DART_KEY: ${{ secrets.DART_KEY }}      # 없어도 동작함 (있으면 DART 사업보고서로 회사 소개)
      - uses: actions/cache/save@v4     # 실행이 중간에 실패하거나 시간 초과돼도 받은 데이터는 저장
        if: always()
        with:
          path: cache
          key: krx-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
